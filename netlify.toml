[build]
  command = "bash scripts/montar.sh"
  publish = "public"

# Link curto para compartilhar (abre o app normalmente)
[[redirects]]
  from = "/radar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hoje"
  to = "/index.html"
  status = 200

# Painel privado (só abre com a chave; fora do Google)
[[redirects]]
  from = "/painel"
  to = "/painel.html"
  status = 200

[[headers]]
  for = "/painel*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
